<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Playground · Understanding The Universe</title><link rel="stylesheet" href="../style.css"></head><body><header><div class="container" style="padding:20px 0"><a href="../index.html">✦ Understanding The Universe</a></div></header><section class="article-hero"><div class="container"><p>Interactive · Projectile Motion</p><h1>Physics Playground</h1></div></section><main class="article-content"><h2>Projectile motion</h2><p>Change the initial speed and launch angle. This ideal model ignores air resistance.</p><div class="sim-card"><label>Speed <input id="speed" type="range" min="1" max="100" value="20"><span id="sv">20</span> m/s</label><br><label>Angle <input id="angle" type="range" min="1" max="89" value="45"><span id="av">45</span>°</label><div id="out" class="sim-output"></div></div><div class="formula">R = v² sin(2θ) / g</div><script>const s=document.getElementById('speed'),a=document.getElementById('angle'),sv=document.getElementById('sv'),av=document.getElementById('av'),o=document.getElementById('out');function f(){let v=+s.value,d=+a.value,t=d*Math.PI/180,g=9.80665,R=v*v*Math.sin(2*t)/g,H=v*v*Math.sin(t)**2/(2*g),T=2*v*Math.sin(t)/g;sv.textContent=v;av.textContent=d;o.textContent=`Range: ${R.toFixed(2)} m | Max height: ${H.toFixed(2)} m | Flight time: ${T.toFixed(2)} s`}s.oninput=a.oninput=f;f();</script><div class="article-nav"><a href="../index.html#library">← Library</a><a href="../index.html#paths">Explore →</a></div></main><footer><div class="container" style="padding:30px 0">© Understanding The Universe</div></footer></body></html>
